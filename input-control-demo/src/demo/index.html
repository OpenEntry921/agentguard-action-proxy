<!doctype html><html lang="ko"><meta charset="utf-8"><title>AgentGuard Input & Data Control Demo</title><style>body{font-family:system-ui;margin:2rem;background:#f7f8fb;color:#172033}.card{background:white;border:1px solid #ddd;border-radius:12px;padding:1rem;margin:1rem 0}textarea{width:100%;height:120px}.ALLOW{color:#12805c}.MASK{color:#0969da}.REVIEW{color:#b76500}.BLOCK{color:#cf222e}pre{white-space:pre-wrap;background:#f2f4f8;padding:1rem;border-radius:8px}</style><body><h1>AgentGuard Input & Data Control Demo</h1><p>AI 모델 또는 외부 시스템 전달 전에 프롬프트와 문서를 규칙 기반으로 검사하는 사전 통제 MVP입니다.</p><div class=card><h2>프롬프트 입력</h2><select id=dest><option>external_llm/demo-provider</option></select><textarea id=prompt>홍길동의 이메일은 hong@example.com이고 전화번호는 010-1234-5678입니다.
이 내용을 요약해줘.</textarea><p><button onclick="inspectPrompt()">분석 실행</button></p></div><div class=card><h2>파일 업로드</h2><input id=file type=file><button onclick="inspectFile()">파일 분석 실행</button></div><div class=card><h2>최종 결정</h2><div id=decision>대기 중</div><h3>탐지 결과 / 파일 메타데이터 / 적용 정책</h3><pre id=result></pre><h3>마스킹 전·후 비교</h3><pre id=masking></pre><h3>감사 증적 타임라인</h3><pre id=audit></pre></div><script>
async function show(r,original){const j=await r.json();document.getElementById('decision').innerHTML=`<b class="${j.decision}">${icon(j.decision)} ${j.decision}</b> - ${j.summary||''}`;document.getElementById('result').textContent=JSON.stringify({findings:j.findings,fileMetadata:j.fileMetadata,appliedPolicies:j.appliedPolicies,evidence:j.evidence},null,2);document.getElementById('masking').textContent=JSON.stringify({before:original,after:j.masking?.safeText,masking:j.masking},null,2);const a=await fetch('/audit').then(x=>x.json());document.getElementById('audit').textContent=JSON.stringify(a.events,null,2)}
function icon(d){return d==='ALLOW'?'✅':d==='MASK'?'🔵':d==='REVIEW'?'⚠️':'⛔'}
async function inspectPrompt(){const prompt=document.getElementById('prompt').value;show(await fetch('/input/inspect',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({requestId:'ui-'+Date.now(),actorId:'user-demo',destination:{type:'external_llm',provider:'demo-provider'},prompt})}),prompt)}
async function inspectFile(){const f=document.getElementById('file').files[0];const fd=new FormData();fd.append('requestId','file-ui-'+Date.now());fd.append('file',f);show(await fetch('/files/inspect',{method:'POST',body:fd}),f?.name)}
</script></body></html>
